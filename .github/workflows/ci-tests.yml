name: CI Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
    steps:
      - name: Check out isaac-agent
        uses: actions/checkout@v4

      - name: Check out isaac (fixture modules)
        run: git clone --depth 1 https://github.com/slagyr/isaac.git ../isaac

      - name: Check out isaac-foundation
        run: git clone --depth 1 https://github.com/slagyr/isaac-foundation.git ../isaac-foundation

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure and Babashka
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          bb: latest
          cli: latest

      # Avoid apt-get: ubuntu-latest's google-chrome repo currently 100s
      # apt-get update on Hash Sum mismatch, aborting the job before rg.
      - name: Cache ripgrep binary
        id: cache-rg
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/rg
          key: ripgrep-14.1.0-musl-${{ runner.os }}

      - name: Install ripgrep
        if: steps.cache-rg.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if command -v rg >/dev/null; then
            exit 0
          fi
          mkdir -p ~/.local/bin
          curl -fsSL https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep-14.1.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xz --strip-components=1 -C ~/.local/bin ripgrep-14.1.0-x86_64-unknown-linux-musl/rg
          chmod +x ~/.local/bin/rg

      - name: Add ripgrep to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify ripgrep
        run: rg --version

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: ${{ runner.os }}-clojure-agent-${{ hashFiles('**/deps.edn', '**/bb.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-agent-

      - name: Run bb ci
        run: bb ci
